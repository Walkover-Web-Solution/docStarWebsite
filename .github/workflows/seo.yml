# Checks every pull request: types, content schema and SEO rules, a production build, the SEO crawl of
# that build (scripts/seo-check.mjs) and Lighthouse budgets (lighthouserc.json). No database and no
# secrets: the site renders from the bundled content in src/content.
name: SEO and build checks

on:
  pull_request:
  push:
    branches: [main, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:content
      - run: npm run build
      - name: Start the site
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run seo:check
        env:
          SEO_BASE_URL: http://localhost:3000
      - run: npm run lhci
      - name: Draft pages render and pass too
        run: |
          pkill -f "next start" || true
          NEXT_PUBLIC_SHOW_DRAFT_PAGES=1 npm run build
          NEXT_PUBLIC_SHOW_DRAFT_PAGES=1 npm run start -- -p 3001 > drafts.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/ && break; sleep 1; done
          SEO_BASE_URL=http://localhost:3001 npm run seo:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: seo/lighthouse/ci
          if-no-files-found: ignore
